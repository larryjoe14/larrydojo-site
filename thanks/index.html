<style>
:root{
  --ink:#0e0f12; --ink-2:#16181d; --ink-3:#24272e; --ink-4:#31353d;
  --text:#e9eaec; --fog:#8a8f99; --dim:#666b74;
  --canary:#e8b93b;
  --display:"Archivo",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --wrap:1180px; --gutter:clamp(18px,4vw,48px);
  --pad:clamp(64px,9vw,120px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);
  font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}

h1,h2{font-family:var(--display);font-weight:600;text-transform:uppercase;margin:0}
h1{font-size:clamp(32px,5.2vw,66px);line-height:.96;letter-spacing:.015em}
h2{font-size:clamp(23px,3vw,38px);line-height:1.02;letter-spacing:.022em}
h3{font-family:var(--display);font-weight:600;text-transform:uppercase;
  font-size:clamp(15px,1.4vw,17px);line-height:1.2;letter-spacing:.07em;margin:0}
p{margin:0 0 14px}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--canary);outline-offset:3px}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gutter)}
section{padding:var(--pad) 0;border-top:1px solid var(--ink-3)}
section.first{border-top:0;padding-top:clamp(28px,4vw,48px)}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:start}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
@media(max-width:820px){.split{grid-template-columns:1fr}}

.eyebrow{font:500 11.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin-bottom:20px}
.spec{font:400 12.5px/1.5 var(--mono);color:var(--fog);letter-spacing:.02em}
.lede{font-size:clamp(18px,1.9vw,21px);line-height:1.45;color:var(--text);max-width:44ch}
.muted{color:var(--fog)}

header{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.94);
  backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--ink-3)}
.nav{display:flex;align-items:center;gap:26px;height:66px}
.brand{font:500 14px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;
  text-decoration:none;margin-right:auto;color:var(--text)}
.nav nav{display:flex;gap:24px}
.nav nav a{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--fog);text-decoration:none}
.nav nav a:hover{color:var(--text)}
@media(max-width:760px){.nav nav{display:none}}

.btn{display:inline-block;padding:13px 22px;border:1px solid var(--ink-4);border-radius:2px;
  font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;color:var(--text);background:transparent;cursor:pointer}
.btn:hover{border-color:var(--fog)}
.btn.solid{background:var(--canary);border-color:var(--canary);color:#151104}
.btn.solid:hover{background:#f2c852}
.btn.quiet{padding:10px 0;border:0;color:var(--text);text-decoration:underline;
  text-decoration-color:var(--ink-4)}
.btn.quiet:hover{text-decoration-color:var(--fog)}

/* hero player: silent loop -> click loads the full film */
.player{position:relative;aspect-ratio:16/9;background:var(--ink-2);
  border:1px solid var(--ink-3);border-radius:2px;overflow:hidden}
.player video,.player img{width:100%;height:100%;object-fit:cover}
.player iframe{width:100%;height:100%;border:0;display:block}
.player::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(14,15,18,.34) 0%,rgba(14,15,18,0) 34%,rgba(14,15,18,.5) 100%)}
.player.live::after{display:none}
.play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;
  border:0;background:var(--canary);cursor:pointer;display:grid;place-items:center;z-index:2}
.play::after{content:"";width:0;height:0;margin-left:6px;
  border-left:22px solid #151104;border-top:14px solid transparent;border-bottom:14px solid transparent}
.play:hover{background:#f2c852}
.tag{position:absolute;left:16px;bottom:14px;z-index:2;
  font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}

.grid{display:grid;gap:clamp(20px,3vw,34px)}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.grid.three{grid-template-columns:1fr}}

.card{display:block;text-decoration:none;color:inherit}
.card .thumb{aspect-ratio:16/9;background:var(--ink-2);border:1px solid var(--ink-3);
  border-radius:2px;overflow:hidden;margin-bottom:16px}
.card .thumb img{width:100%;height:100%;object-fit:cover;
  filter:saturate(.82);transition:transform .5s ease,filter .5s ease}
.card:hover .thumb img{transform:scale(1.02);filter:saturate(1)}
.card h3{margin-bottom:10px}
.card .spec{margin-bottom:10px}
.card .go{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fog)}
.card:hover .go{color:var(--canary)}

.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,4vw,52px)}
@media(max-width:900px){.pillars{grid-template-columns:1fr}}
.pillar{border-top:1px solid var(--ink-3);padding-top:22px}
.pillar .lbl{font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin-bottom:16px}
.pillar h3{font-size:clamp(17px,1.7vw,20px);letter-spacing:.045em;line-height:1.25;margin-bottom:12px}
.pillar p{color:var(--fog);margin:0;font-size:16px}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(14px,2.2vw,26px)}
.step{border-top:1px solid var(--ink-3);padding-top:16px}
.step .n{font:500 11px/1 var(--mono);color:var(--dim);letter-spacing:.14em;margin-bottom:12px}
.step h3{font-size:14px;letter-spacing:.06em;line-height:1.3}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}

.box{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:2px;padding:clamp(20px,3vw,32px)}
label{display:block;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:18px 0 8px}
input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--ink-3);border-radius:2px;
  color:var(--text);font:400 16px/1.4 var(--body);padding:12px}
textarea{min-height:104px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--fog);outline:none}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}

footer{border-top:1px solid var(--ink-3);padding:44px 0 60px;color:var(--fog);font-size:14px}
footer a{color:var(--fog)}
footer .row{gap:20px}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
